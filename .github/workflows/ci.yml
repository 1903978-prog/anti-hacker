# CI: every push to integration and every pull request runs the type check,
# ESLint, the full test suite and the browser page check (Playwright +
# axe-core at 1440/390/360 px). Render is set to deploy only when these
# checks pass (render.yaml: autoDeployTrigger: checksPass).
#
# Cost: the repo is public, so Actions minutes are free; one run takes about
# 2-3 minutes. Session branches (claude/**) never run on push: CI runs on the
# PR that ships and on the integration push that Render waits for. A newer
# commit cancels the older run. Docs-only changes skip it.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04, which Playwright cannot install on
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Install Chromium for the page check
        run: npx playwright install --with-deps chromium
      - name: Page check (no sideways scroll, no axe-core violations)
        run: npm run test:page
