name: Global engineering orchestrator

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eendigo-global-engineering-orchestrator
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test queue rules
        run: node --test .github/scripts/engineering-orchestrator.node-test.mjs
      - name: Audit tasks, PRs and CI; assign one eligible task
        env:
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
        run: node .github/scripts/engineering-orchestrator.mjs

