<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>secval</title>
    <style>
      :root {
        --bg: #f6f7f9; --surface: #fff; --border: #e2e5ea; --text: #1a1d24;
        --muted: #697086; --accent: #2f6df6; --danger: #d23b3b;
        --high: #d23b3b; --medium: #d98324; --low: #c0a000; --info: #697086;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171c; --surface: #1c2027; --border: #2b313b; --text: #e8eaed;
          --muted: #9aa2b1; --accent: #5b8dff; --danger: #ef5a5a;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
      header .sub { color: var(--muted); font-size: 13px; }
      main { max-width: 820px; margin: 0 auto; padding: 16px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      .card h2 { font-size: 15px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      input, select { flex: 1; min-width: 160px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
      button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button.danger { background: var(--danger); }
      button:disabled { opacity: .5; cursor: default; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      .badge { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
      .badge.ok { color: #1f9d55; border-color: #1f9d5544; }
      .sev { font-weight: 600; text-transform: uppercase; font-size: 11px; }
      .sev.high { color: var(--high); } .sev.medium { color: var(--medium); }
      .sev.low { color: var(--low); } .sev.info { color: var(--info); }
      .muted { color: var(--muted); }
      .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
      .ks { display: flex; align-items: center; gap: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #1f9d55; }
      .dot.engaged { background: var(--danger); }
      code { background: var(--bg); padding: 1px 5px; border-radius: 5px; font-size: 13px; word-break: break-all; }
      .right { text-align: right; }
    </style>
  </head>
  <body>
    <header>
      <h1>secval</h1>
      <span class="sub">authorized security validation — your assets only</span>
      <span style="flex:1"></span>
      <span class="ks"><span id="ksDot" class="dot"></span><span id="ksLabel" class="muted">…</span></span>
      <button id="ksBtn" class="ghost">…</button>
    </header>
    <main>
      <div class="card">
        <h2>Run a passive scan</h2>
        <div class="row">
          <input id="scanUrl" placeholder="https://eendigo.com" />
          <button id="scanBtn">Scan</button>
        </div>
        <div id="scanMsg" class="note"></div>
        <div id="findings"></div>
      </div>

      <div class="card">
        <h2>Allowlist</h2>
        <div class="row" style="margin-bottom:12px">
          <input id="addDomain" placeholder="add a domain you own (e.g. example.com)" />
          <button id="addBtn" class="ghost">Add</button>
        </div>
        <table id="allowTable"><tbody></tbody></table>
        <div id="proofMsg" class="note"></div>
        <div class="note">A domain can only be scanned once ownership is proven. Issue a challenge, place the token, then verify.</div>
      </div>

      <div class="card">
        <h2>Automatic scans</h2>
        <div class="row" style="align-items:center">
          <span id="scheduleText" class="muted" style="flex:1">…</span>
          <button id="runNowBtn" class="ghost">Run all now</button>
        </div>
        <div id="scheduleMsg" class="note"></div>
      </div>

      <div class="card">
        <h2>Recent scans</h2>
        <table id="scansTable"><tbody></tbody></table>
      </div>

      <div class="card">
        <h2>Audit trail <span class="muted">(append-only)</span></h2>
        <table id="auditTable"><tbody></tbody></table>
      </div>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
