<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>secval</title>
    <style>
      :root {
        --bg: #f6f7f9; --surface: #fff; --border: #e2e5ea; --text: #1a1d24;
        --muted: #697086; --accent: #2f6df6; --danger: #d23b3b;
        --high: #d23b3b; --medium: #d98324; --low: #c0a000; --info: #697086;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171c; --surface: #1c2027; --border: #2b313b; --text: #e8eaed;
          --muted: #9aa2b1; --accent: #5b8dff; --danger: #ef5a5a;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
      header .sub { color: var(--muted); font-size: 13px; }
      main { max-width: 820px; margin: 0 auto; padding: 16px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
      .card h2 { font-size: 15px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      input, select { flex: 1; min-width: 160px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
      button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
      button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button.danger { background: var(--danger); }
      button:disabled { opacity: .5; cursor: default; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      .badge { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }
      .badge.ok { color: #1f9d55; border-color: #1f9d5544; }
      .sev { font-weight: 600; text-transform: uppercase; font-size: 11px; }
      .sev.high { color: var(--high); } .sev.medium { color: var(--medium); }
      .sev.low { color: var(--low); } .sev.info { color: var(--info); }
      .muted { color: var(--muted); }
      .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
      .ks { display: flex; align-items: center; gap: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #1f9d55; }
      .dot.engaged { background: var(--danger); }
      code { background: var(--bg); padding: 1px 5px; border-radius: 5px; font-size: 13px; word-break: break-all; }
    </style>
  </head>
  <body>
    <header>
      <h1>secval</h1>
      <span class="sub">authorized security validation — your assets only</span>
      <span style="flex:1"></span>
      <span class="ks"><span id="ksDot" class="dot"></span><span id="ksLabel" class="muted">…</span></span>
      <button id="ksBtn" class="ghost">…</button>
    </header>
    <main>
      <div class="card">
        <h2>Run a passive scan</h2>
        <div class="row">
          <input id="scanUrl" placeholder="https://eendigo.com" />
          <button id="scanBtn">Scan</button>
        </div>
        <div id="scanMsg" class="note"></div>
        <div id="findings"></div>
      </div>

      <div class="card">
        <h2>Allowlist</h2>
        <div class="row" style="margin-bottom:12px">
          <input id="addDomain" placeholder="add a domain you own (e.g. example.com)" />
          <button id="addBtn" class="ghost">Add</button>
        </div>
        <table id="allowTable"><tbody></tbody></table>
        <div class="note">A domain can only be scanned once ownership is proven. Issue a challenge, place the token, then verify.</div>
      </div>

      <div class="card">
        <h2>Automatic scans</h2>
        <div class="row" style="align-items:center">
          <span id="scheduleText" class="muted" style="flex:1">…</span>
          <button id="runNowBtn" class="ghost">Run all now</button>
        </div>
        <div id="scheduleMsg" class="note"></div>
      </div>

      <div class="card">
        <h2>Recent scans</h2>
        <table id="scansTable"><tbody></tbody></table>
      </div>

      <div class="card">
        <h2>Audit trail <span class="muted">(append-only)</span></h2>
        <table id="auditTable"><tbody></tbody></table>
      </div>
    </main>

    <script>
      const api = (path, opts) => fetch(path, { headers: { "content-type": "application/json" }, ...opts }).then((r) => r.json().then((b) => ({ ok: r.ok, status: r.status, body: b })));
      const el = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

      async function refreshKillSwitch() {
        const { body } = await api("/health");
        const engaged = body.killSwitch === "engaged";
        el("ksDot").className = "dot" + (engaged ? " engaged" : "");
        el("ksLabel").textContent = engaged ? "kill switch ENGAGED" : "operational";
        el("ksBtn").textContent = engaged ? "Release" : "Engage kill switch";
        el("ksBtn").className = engaged ? "ghost" : "danger";
        el("ksBtn").dataset.engaged = engaged;
      }
      el("ksBtn").onclick = async () => {
        const engaged = el("ksBtn").dataset.engaged === "true";
        await api("/api/kill-switch/" + (engaged ? "release" : "engage"), { method: "POST", body: "{}" });
        refreshKillSwitch();
        refreshAudit();
      };

      async function refreshAllowlist() {
        const { body } = await api("/api/allowlist");
        const rows = body.map((e) => `
          <tr>
            <td><code>${esc(e.domain)}</code></td>
            <td>${e.ownershipProven ? '<span class="badge ok">proven</span>' : '<span class="badge">unproven</span>'}
                ${e.activeEligible ? '<span class="badge ok">active-eligible</span>' : ""}</td>
            <td style="text-align:right">
              ${e.ownershipProven ? "" : `<button class="ghost" data-challenge="${esc(e.domain)}">Challenge</button>
              <button class="ghost" data-verify="${esc(e.domain)}">Verify</button>`}
              <button class="ghost" data-remove="${esc(e.domain)}">Remove</button>
            </td>
          </tr>`).join("");
        el("allowTable").querySelector("tbody").innerHTML = rows || `<tr><td class="muted">empty</td></tr>`;
      }

      el("addBtn").onclick = async () => {
        const domain = el("addDomain").value.trim();
        if (!domain) return;
        await api("/api/allowlist", { method: "POST", body: JSON.stringify({ domain }) });
        el("addDomain").value = "";
        refreshAllowlist(); refreshAudit();
      };

      document.addEventListener("click", async (ev) => {
        const t = ev.target;
        if (t.dataset.challenge) {
          const { body } = await api(`/api/allowlist/${t.dataset.challenge}/challenge`, { method: "POST", body: "{}" });
          prompt("Place this token via a DNS TXT record at _secval-challenge." + t.dataset.challenge + "\nor at /.well-known/secval-challenge.txt, then click Verify.\n\nToken (copy):", body.token);
        } else if (t.dataset.verify) {
          const method = confirm("OK = verify by DNS TXT record.\nCancel = verify by token file on the site.") ? "dns-txt" : "token-file";
          const { body } = await api(`/api/allowlist/${t.dataset.verify}/verify`, { method: "POST", body: JSON.stringify({ method }) });
          alert(body.verified ? "Ownership verified." : "Not verified: " + body.reason);
          refreshAllowlist(); refreshAudit();
        } else if (t.dataset.remove) {
          if (confirm("Remove " + t.dataset.remove + "?")) {
            await api(`/api/allowlist/${t.dataset.remove}`, { method: "DELETE" });
            refreshAllowlist(); refreshAudit();
          }
        }
      });

      el("scanBtn").onclick = async () => {
        const target = el("scanUrl").value.trim();
        if (!target) return;
        el("scanBtn").disabled = true;
        el("scanMsg").textContent = "Requesting approval and scanning…";
        el("findings").innerHTML = "";
        try {
          const { ok, status, body } = await api("/api/scan", { method: "POST", body: JSON.stringify({ target }) });
          if (status === 403) { el("scanMsg").textContent = "Blocked by policy: " + body.reason; }
          else if (!ok) { el("scanMsg").textContent = "Scan could not complete: " + (body.reason || status); }
          else {
            el("scanMsg").textContent = `Scan complete — ${body.findings.length} finding(s).`;
            el("findings").innerHTML = renderFindings(body.findings);
          }
        } finally {
          el("scanBtn").disabled = false;
          refreshScans(); refreshAudit();
        }
      };

      function renderFindings(findings) {
        if (!findings.length) return `<p class="note">No passive weaknesses found.</p>`;
        const order = { high: 0, medium: 1, low: 2, info: 3 };
        findings.sort((a, b) => order[a.severity] - order[b.severity]);
        return `<table><tbody>${findings.map((f) => `
          <tr><td><span class="sev ${f.severity}">${f.severity}</span></td>
          <td><strong>${esc(f.title)}</strong><br><span class="muted">${esc(f.detail)}</span></td></tr>`).join("")}</tbody></table>`;
      }

      async function refreshScans() {
        const { body } = await api("/api/scans");
        el("scansTable").querySelector("tbody").innerHTML = body.length ? body.map((s) => `
          <tr><td><code>${esc(s.target)}</code></td><td>${esc(s.status)}</td>
          <td>${s.findingsCount} finding(s)</td><td class="muted">${esc(s.startedAt.replace("T", " ").slice(0, 19))}</td></tr>`).join("")
          : `<tr><td class="muted">no scans yet</td></tr>`;
      }

      async function refreshAudit() {
        const { body } = await api("/api/audit?limit=20");
        el("auditTable").querySelector("tbody").innerHTML = body.map((a) => `
          <tr><td class="muted">${esc(a.ts.replace("T", " ").slice(0, 19))}</td>
          <td>${esc(a.action)}</td><td>${esc(a.target || "")}</td>
          <td><span class="sev ${a.decision === "deny" ? "high" : "info"}">${esc(a.decision)}</span></td></tr>`).join("");
      }

      async function refreshSchedule() {
        const { body } = await api("/api/schedule");
        el("scheduleText").textContent = body.description + (body.lastRun ? ` · last run ${body.lastRun}` : " · not run yet");
      }
      el("runNowBtn").onclick = async () => {
        el("runNowBtn").disabled = true;
        el("scheduleMsg").textContent = "Scanning all proven sites…";
        const { body } = await api("/api/schedule/run-now", { method: "POST", body: "{}" });
        el("scheduleMsg").textContent = `Done — scanned ${body.scanned} site(s), ${body.skipped} skipped (ownership not proven), ${body.totalFindings} finding(s).`;
        el("runNowBtn").disabled = false;
        refreshScans(); refreshAudit();
      };

      refreshKillSwitch(); refreshAllowlist(); refreshScans(); refreshAudit(); refreshSchedule();
    </script>
  </body>
</html>
