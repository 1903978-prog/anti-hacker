# Render deployment config for secval (Blueprint).
# Free-tier web service: no persistent disk is attached, so the SQLite store
# lives on the container's ephemeral filesystem and RESETS on each deploy,
# restart, or free-tier sleep. To keep it, set the four LITESTREAM_* values
# below (a free Backblaze B2 bucket): Litestream then backs the store up
# continuously and restores it on boot. Without them secval runs as before.
#
# `tsx` is a runtime dependency so `npm start` works even with
# NODE_ENV=production (which otherwise skips devDependencies).
#
# DO NOT change hosts/plan without Livio's say-so.
services:
  - type: web
    name: secval
    runtime: node
    plan: free
    # Deploy a new commit on integration only after GitHub CI (type check,
    # lint, tests, page check) has passed on it.
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build && bash scripts/get-litestream.sh
    startCommand: bash scripts/start.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Free Backblaze B2 backup (filled in on the Render dashboard).
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # New-finding alert e-mail (Resend). Without the key the sweep still runs
      # and records "alert e-mail not configured" in the audit trail.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_TO
        value: livio.moretti@eendigo.com
      # Usage tab (read-only tokens; each tile says "not connected" until set).
      - key: GITHUB_USAGE_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: FLY_API_TOKEN
        sync: false
      - key: NEON_API_KEY
        sync: false
      # Dropbox backup check (read-only; the check says "not connected" until set).
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
    # To make data durable later, upgrade off free and uncomment:
    #   envVars: [{ key: DATA_DIR, value: /var/data }]
    #   disk: { name: secval-data, mountPath: /var/data, sizeGB: 1 }
